version: '3.8'

# ==============================================================================
# Database QA MCP Gateway (Docker / OrbStack Bastion)
# ==============================================================================
# Menjalankan 2 Gateway terisolasi untuk DEV_primary dan DEV_db-external-dev.
# Kredensial database tersimpan secara aman di level container (.env.docker),
# sehingga host workspace dan AI Agent tidak memiliki akses langsung / password.
# ==============================================================================

services:
  # Gateway 1: Database Inti / Primary (DEV_primary)
  mcp-primary-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-qa-primary-gateway
    restart: unless-stopped
    command: ["-transport", "http", "-addr", "0.0.0.0:8080", "-statement-timeout", "5s"]
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=${DB_PRIMARY_URL:-postgres://${DB_PRIMARY_USER:-qa_read_only}:${DB_PRIMARY_PASS:-your_secure_password}@${DB_PRIMARY_HOST:-staging-postgres.example.internal}:${DB_PRIMARY_PORT:-5432}/${DB_PRIMARY_NAME:-primary_dev}?sslmode=disable}
    env_file:
      - path: .env.docker
        required: false

  # Gateway 2: Database Layanan Eksternal (DEV_db-external-dev)
  mcp-external-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-qa-external-gateway
    restart: unless-stopped
    command: ["-transport", "http", "-addr", "0.0.0.0:8080", "-statement-timeout", "5s"]
    ports:
      - "8082:8080"
    environment:
      - DATABASE_URL=${DB_EXTERNAL_DEV_URL:-postgres://${DB_EXTERNAL_DEV_USER}:${DB_EXTERNAL_DEV_PASS}@${DB_EXTERNAL_DEV_HOST}:${DB_EXTERNAL_DEV_PORT:-5432}/${DB_EXTERNAL_DEV_NAME}?sslmode=disable}
    env_file:
      - path: .env.docker
        required: false
